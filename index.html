<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Siłowy Trening – Gym App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gym: {
              900: '#0f0f0f',
              800: '#1a1a1a',
              700: '#262626',
              600: '#333333',
              accent: '#ef4444',
              accentHover: '#dc2626',
              green: '#22c55e',
              blue: '#3b82f6',
              yellow: '#eab308'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .timer-circle {
      transition: stroke-dashoffset 0.3s linear;
    }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pulse-red { animation: pulseRed 1s infinite; }
    @keyframes pulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); } }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  </style>
</head>
<body class="bg-gym-900 text-white min-h-screen">
  <div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col">

    <!-- ========== HEADER ========== -->
    <header class="sticky top-0 z-40 bg-gym-800/95 backdrop-blur border-b border-gym-700 px-4 py-3 flex items-center justify-between">
      <h1 id="page-title" class="text-lg font-bold tracking-tight">Siłowy Trening</h1>
      <div id="header-actions" class="flex gap-2"></div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main id="content" class="flex-1 overflow-y-auto px-4 py-4 safe-bottom"></main>

    <!-- ========== BOTTOM NAV ========== -->
    <nav id="bottom-nav" class="sticky bottom-0 z-40 bg-gym-800 border-t border-gym-700 safe-bottom">
      <div class="flex justify-around py-2">
        <button onclick="navigate('home')" data-page="home" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-medium text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
          Start
        </button>
        <button onclick="navigate('exercises')" data-page="exercises" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-medium text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          Ćwiczenia
        </button>
        <button onclick="navigate('history')" data-page="history" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-medium text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Historia
        </button>
        <button onclick="navigate('settings')" data-page="settings" class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1 text-xs font-medium text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          Ustawienia
        </button>
      </div>
    </nav>
  </div>

  <!-- ========== MODAL ========== -->
  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/70" onclick="closeModal()"></div>
    <div id="modal-content" class="absolute bottom-0 left-0 right-0 max-w-lg mx-auto bg-gym-800 rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto safe-bottom"></div>
  </div>

  <!-- ========== TOAST ========== -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-lg text-sm font-medium shadow-lg"></div>

  <script>
    // ==================== DATA & STATE ====================
    const DEFAULT_EXERCISES = [
      { id: 'ex1', name: 'Wyciskanie sztangi leżąc', muscle: 'Klatka', description: 'Leżąc na ławce poziomej, sztanga na wysokości klatki. Opuszczaj kontrolowanie do klatki, wyciskaj mocno w górę. Łopatki ściągnięte.', image: 'https://images.unsplash.com/photo-1534368945116-118e3117f6fd?w=400&h=300&fit=crop' },
      { id: 'ex2', name: 'Przysiad ze sztangą', muscle: 'Nogi', description: 'Sztanga na trapezie. Stopy na szerokość barków, zejdź w dół aż uda będą równoległe do podłoża. Kolana w linii ze stopami.', image: 'https://images.unsplash.com/photo-1574680178050-55c6a6a96e0a?w=400&h=300&fit=crop' },
      { id: 'ex3', name: 'Martwy ciąg klasyczny', muscle: 'Plecy', description: 'Stopy pod sztangą, chwyt na szerokość barków. Proste plecy, wypchnij biodra do tyłu, podnieś sztangę prowadząc blisko ciała.', image: 'https://images.unsplash.com/photo-1603287681836-b0349f1c1a5f?w=400&h=300&fit=crop' },
      { id: 'ex4', name: 'Wyciskanie żołnierskie', muscle: 'Barki', description: 'Sztanga na wysokości barków, wyciskaj nad głowę. Łokcie lekko do przodu. Nie uginaj kręgosłupa.', image: 'https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=400&h=300&fit=crop' },
      { id: 'ex5', name: 'Podciąganie na drążku', muscle: 'Plecy', description: 'Chwyt na szerokość barków lub szerszy. Podciągnij się aż broda ponad drążek. Kontrolowane opuszczanie.', image: 'https://images.unsplash.com/photo-1598971639058-a0c0c0c0c0c0?w=400&h=300&fit=crop' },
      { id: 'ex6', name: 'Uginanie sztangi na biceps', muscle: 'Biceps', description: 'Stojąc, sztanga w dłoniach. Uginaj łokcie, trzymając je blisko tułowia. Nie bujaj ciałem.', image: 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=400&h=300&fit=crop' },
      { id: 'ex7', name: 'Prostowanie na wyciągu (triceps)', muscle: 'Triceps', description: 'Stojąc przy wyciągu górnym, prostuj ramiona w dół. Łokcie nieruchome przy tułowiu.', image: 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=400&h=300&fit=crop' },
      { id: 'ex8', name: 'Wyciskanie hantli na skosie', muscle: 'Klatka', description: 'Ławka pod kątem 30-45°. Hantle na wysokości klatki, wyciskaj do góry z lekkim zbliżeniem na górze.', image: 'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=400&h=300&fit=crop' },
      { id: 'ex9', name: 'Wiosłowanie sztangą w opadzie', muscle: 'Plecy', description: 'Tułów pochylony ~45°. Sztanga przy brzuchu, ściągaj łopatki. Nie zaokrąglaj pleców.', image: 'https://images.unsplash.com/photo-1603287681836-b0349f1c1a5f?w=400&h=300&fit=crop' },
      { id: 'ex10', name: 'Wykroki z hantlami', muscle: 'Nogi', description: 'Krok do przodu, zejdź aż tylne kolano prawie dotknie podłoża. Wróć i zmień nogę.', image: 'https://images.unsplash.com/photo-1434608519344-49d20ed3c633?w=400&h=300&fit=crop' },
      { id: 'ex11', name: 'Face pull', muscle: 'Barki', description: 'Wyciąg górny, lina. Ciągnij do twarzy, łokcie wysoko. Ściągaj łopatki i rotuj barki na zewnątrz.', image: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400&h=300&fit=crop' },
      { id: 'ex12', name: 'Plank', muscle: 'Core', description: 'Oparcie na przedramionach i palcach stóp. Ciało w linii prostej. Napnij brzuch i pośladki.', image: 'https://images.unsplash.com/photo-1566241440091-ec10de8db2e1?w=400&h=300&fit=crop' }
    ];

    const DEFAULT_SETTINGS = {
      restTime: 90,          // sekundy – standard
      myoRestTime: 15,       // sekundy – Myo-reps
      myoActivationReps: 12, // docelowe powtórzenia aktywacyjne
      myoMiniReps: 4,        // mini-serie
      soundEnabled: true,
      vibrateEnabled: true
    };

    let state = {
      page: 'home',
      exercises: [],
      workouts: [],
      settings: { ...DEFAULT_SETTINGS },
      // aktywny trening
      activeWorkout: null,
      // timer
      timer: null,
      timerSeconds: 0,
      timerTotal: 0,
      timerRunning: false
    };

    // ==================== STORAGE ====================
    function loadData() {
      try {
        const ex = localStorage.getItem('gym_exercises');
        const wo = localStorage.getItem('gym_workouts');
        const se = localStorage.getItem('gym_settings');
        state.exercises = ex ? JSON.parse(ex) : [...DEFAULT_EXERCISES];
        state.workouts = wo ? JSON.parse(wo) : [];
        state.settings = se ? { ...DEFAULT_SETTINGS, ...JSON.parse(se) } : { ...DEFAULT_SETTINGS };
      } catch (e) {
        state.exercises = [...DEFAULT_EXERCISES];
        state.workouts = [];
        state.settings = { ...DEFAULT_SETTINGS };
      }
    }

    function saveExercises() { localStorage.setItem('gym_exercises', JSON.stringify(state.exercises)); }
    function saveWorkouts() { localStorage.setItem('gym_workouts', JSON.stringify(state.workouts)); }
    function saveSettings() { localStorage.setItem('gym_settings', JSON.stringify(state.settings)); }

    // ==================== UTILS ====================
    function uid() { return 'id' + Date.now() + Math.random().toString(36).slice(2, 7); }
    function formatDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }
    function toast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-sm font-medium shadow-lg ${
        type === 'success' ? 'bg-gym-green text-black' : type === 'error' ? 'bg-gym-accent text-white' : 'bg-gym-600 text-white'
      }`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2200);
    }
    function playBeep() {
      if (!state.settings.soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 180);
      } catch (e) {}
    }
    function vibrate(pattern = [200]) {
      if (state.settings.vibrateEnabled && navigator.vibrate) navigator.vibrate(pattern);
    }

    // ==================== NAVIGATION ====================
    function navigate(page) {
      if (state.activeWorkout && page !== 'workout' && !confirm('Masz aktywny trening. Na pewno chcesz wyjść? (dane nie zostaną zapisane)')) return;
      if (page !== 'workout') state.activeWorkout = null;
      stopTimer();
      state.page = page;
      render();
    }

    function setActiveNav() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.page === state.page || (state.page === 'workout' && btn.dataset.page === 'home');
        btn.classList.toggle('text-gym-accent', isActive);
        btn.classList.toggle('text-gray-400', !isActive);
      });
    }

    // ==================== TIMER ====================
    function startTimer(seconds, onFinish) {
      stopTimer();
      state.timerSeconds = seconds;
      state.timerTotal = seconds;
      state.timerRunning = true;
      state.timerCallback = onFinish;
      renderTimerUI();
      state.timer = setInterval(() => {
        state.timerSeconds--;
        renderTimerUI();
        if (state.timerSeconds <= 0) {
          stopTimer();
          playBeep();
          vibrate([200, 100, 200]);
          toast('Czas odpoczynku minął!', 'success');
          if (onFinish) onFinish();
        }
      }, 1000);
    }

    function stopTimer() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      state.timerRunning = false;
      state.timerSeconds = 0;
    }

    function skipTimer() {
      stopTimer();
      if (state.timerCallback) state.timerCallback();
      render();
    }

    function renderTimerUI() {
      const el = document.getElementById('timer-display');
      if (!el) return;
      el.textContent = formatTime(state.timerSeconds);
      const circle = document.getElementById('timer-circle');
      if (circle && state.timerTotal > 0) {
        const progress = state.timerSeconds / state.timerTotal;
        const circumference = 2 * Math.PI * 54;
        circle.style.strokeDashoffset = circumference * (1 - progress);
      }
    }

    // ==================== MODAL ====================
    function openModal(html) {
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    // ==================== RENDER ====================
    function render() {
      setActiveNav();
      const title = document.getElementById('page-title');
      const actions = document.getElementById('header-actions');
      const content = document.getElementById('content');
      const nav = document.getElementById('bottom-nav');

      if (state.page === 'workout') {
        nav.classList.add('hidden');
        title.textContent = state.activeWorkout?.mode === 'myoreps' ? 'Myo-reps' : 'Trening';
        actions.innerHTML = `<button onclick="finishWorkout()" class="text-sm text-gym-accent font-semibold">Zakończ</button>`;
        content.innerHTML = renderWorkout();
      } else {
        nav.classList.remove('hidden');
        actions.innerHTML = '';
        if (state.page === 'home') {
          title.textContent = 'Siłowy Trening';
          content.innerHTML = renderHome();
        } else if (state.page === 'exercises') {
          title.textContent = 'Ćwiczenia';
          actions.innerHTML = `<button onclick="openExerciseForm()" class="bg-gym-accent text-white text-sm px-3 py-1.5 rounded-lg font-semibold">+ Dodaj</button>`;
          content.innerHTML = renderExercises();
        } else if (state.page === 'history') {
          title.textContent = 'Historia';
          content.innerHTML = renderHistory();
        } else if (state.page === 'settings') {
          title.textContent = 'Ustawienia';
          content.innerHTML = renderSettings();
        }
      }
    }

    // ---------- HOME ----------
    function renderHome() {
      const last = state.workouts[0];
      return `
        <div class="space-y-5 fade-in">
          <div class="bg-gradient-to-br from-gym-accent/20 to-gym-700 rounded-2xl p-5 border border-gym-accent/30">
            <h2 class="text-xl font-bold mb-1">Gotowy na trening?</h2>
            <p class="text-gray-400 text-sm mb-4">Wybierz tryb i zacznij logować serie</p>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="startWorkout('standard')" class="bg-gym-accent hover:bg-gym-accentHover text-white font-bold py-3 rounded-xl transition">
                Standard
              </button>
              <button onclick="startWorkout('myoreps')" class="bg-gym-blue hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition">
                Myo-reps
              </button>
            </div>
          </div>

          ${last ? `
          <div>
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Ostatni trening</h3>
            <div class="bg-gym-800 rounded-xl p-4 border border-gym-700">
              <div class="flex justify-between items-start mb-2">
                <span class="font-semibold">${formatDate(last.date)}</span>
                <span class="text-xs px-2 py-0.5 rounded-full ${last.mode === 'myoreps' ? 'bg-blue-500/20 text-blue-400' : 'bg-gym-accent/20 text-gym-accent'}">${last.mode === 'myoreps' ? 'Myo-reps' : 'Standard'}</span>
              </div>
              <p class="text-sm text-gray-400">${last.exercises.length} ćwiczeń • ${last.exercises.reduce((a,e) => a + e.sets.length, 0)} serii</p>
            </div>
          </div>` : ''}

          <div>
            <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Szybkie info</h3>
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-gym-800 rounded-xl p-4 border border-gym-700 text-center">
                <div class="text-2xl font-bold text-gym-accent">${state.exercises.length}</div>
                <div class="text-xs text-gray-400 mt-1">Ćwiczeń</div>
              </div>
              <div class="bg-gym-800 rounded-xl p-4 border border-gym-700 text-center">
                <div class="text-2xl font-bold text-gym-green">${state.workouts.length}</div>
                <div class="text-xs text-gray-400 mt-1">Treningów</div>
              </div>
            </div>
          </div>

          <div class="bg-gym-800 rounded-xl p-4 border border-gym-700">
            <h3 class="font-semibold mb-2">Jak działa Myo-reps?</h3>
            <p class="text-sm text-gray-400 leading-relaxed">
              1. Zrób serię aktywacyjną blisko upadku (np. 12–15 powtórzeń).<br>
              2. Odpoczynek 10–20 sekund (kilka głębokich oddechów).<br>
              3. Mini-serie po 3–5 powtórzeń aż nie dasz rady.<br>
              4. Całość = duża objętość w krótkim czasie.
            </p>
          </div>
        </div>
      `;
    }

    // ---------- EXERCISES ----------
    function renderExercises() {
      if (state.exercises.length === 0) {
        return `<div class="text-center py-16 text-gray-500">Brak ćwiczeń.<br><button onclick="openExerciseForm()" class="mt-4 text-gym-accent font-semibold">Dodaj pierwsze</button></div>`;
      }
      const groups = {};
      state.exercises.forEach(ex => {
        if (!groups[ex.muscle]) groups[ex.muscle] = [];
        groups[ex.muscle].push(ex);
      });
      let html = '<div class="space-y-6 fade-in">';
      Object.keys(groups).sort().forEach(muscle => {
        html += `<div>
          <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">${muscle}</h3>
          <div class="space-y-2">`;
        groups[muscle].forEach(ex => {
          html += `
            <div class="bg-gym-800 rounded-xl border border-gym-700 overflow-hidden flex">
              <div class="w-20 h-20 flex-shrink-0 bg-gym-700">
                ${ex.image ? `<img src="${ex.image}" alt="" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-2xl\\'>💪</div>'">` : `<div class="w-full h-full flex items-center justify-center text-2xl">💪</div>`}
              </div>
              <div class="flex-1 p-3 min-w-0">
                <div class="font-semibold truncate">${ex.name}</div>
                <div class="text-xs text-gray-400 mt-0.5 line-clamp-2">${ex.description || 'Brak opisu'}</div>
              </div>
              <div class="flex flex-col justify-center gap-1 pr-2">
                <button onclick="openExerciseForm('${ex.id}')" class="text-xs text-gym-blue px-2 py-1">Edytuj</button>
                <button onclick="deleteExercise('${ex.id}')" class="text-xs text-gym-accent px-2 py-1">Usuń</button>
              </div>
            </div>`;
        });
        html += '</div></div>';
      });
      html += '</div>';
      return html;
    }

    function openExerciseForm(id = null) {
      const ex = id ? state.exercises.find(e => e.id === id) : null;
      openModal(`
        <h2 class="text-lg font-bold mb-4">${ex ? 'Edytuj ćwiczenie' : 'Nowe ćwiczenie'}</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-400">Nazwa</label>
            <input id="ex-name" type="text" value="${ex?.name || ''}" class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none focus:border-gym-accent" placeholder="np. Wyciskanie sztangi">
          </div>
          <div>
            <label class="text-xs text-gray-400">Grupa mięśniowa</label>
            <select id="ex-muscle" class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none focus:border-gym-accent">
              ${['Klatka','Plecy','Nogi','Barki','Biceps','Triceps','Core','Całe ciało'].map(m => 
                `<option value="${m}" ${ex?.muscle === m ? 'selected' : ''}>${m}</option>`
              ).join('')}
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-400">Opis / wskazówki</label>
            <textarea id="ex-desc" rows="3" class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none focus:border-gym-accent" placeholder="Technika, wskazówki...">${ex?.description || ''}</textarea>
          </div>
          <div>
            <label class="text-xs text-gray-400">Link do zdjęcia (URL)</label>
            <input id="ex-image" type="url" value="${ex?.image || ''}" class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none focus:border-gym-accent" placeholder="https://...">
          </div>
          <div class="flex gap-3 pt-2">
            <button onclick="closeModal()" class="flex-1 bg-gym-700 py-3 rounded-xl font-semibold">Anuluj</button>
            <button onclick="saveExercise('${id || ''}')" class="flex-1 bg-gym-accent py-3 rounded-xl font-semibold">Zapisz</button>
          </div>
        </div>
      `);
    }

    function saveExercise(id) {
      const name = document.getElementById('ex-name').value.trim();
      if (!name) return toast('Podaj nazwę ćwiczenia', 'error');
      const data = {
        name,
        muscle: document.getElementById('ex-muscle').value,
        description: document.getElementById('ex-desc').value.trim(),
        image: document.getElementById('ex-image').value.trim()
      };
      if (id) {
        const idx = state.exercises.findIndex(e => e.id === id);
        if (idx >= 0) state.exercises[idx] = { ...state.exercises[idx], ...data };
      } else {
        state.exercises.push({ id: uid(), ...data });
      }
      saveExercises();
      closeModal();
      render();
      toast('Zapisano ćwiczenie', 'success');
    }

    function deleteExercise(id) {
      if (!confirm('Na pewno usunąć to ćwiczenie?')) return;
      state.exercises = state.exercises.filter(e => e.id !== id);
      saveExercises();
      render();
      toast('Usunięto');
    }

    // ---------- WORKOUT ----------
    function startWorkout(mode) {
      state.activeWorkout = {
        id: uid(),
        date: Date.now(),
        mode,
        exercises: []
      };
      state.page = 'workout';
      render();
    }

    function renderWorkout() {
      const w = state.activeWorkout;
      if (!w) return '';

      let html = `
        <div class="space-y-4 fade-in">
          <div class="flex items-center justify-between">
            <span class="text-sm text-gray-400">Tryb:</span>
            <span class="text-sm font-semibold px-3 py-1 rounded-full ${w.mode === 'myoreps' ? 'bg-blue-500/20 text-blue-400' : 'bg-gym-accent/20 text-gym-accent'}">
              ${w.mode === 'myoreps' ? 'Myo-reps' : 'Standard'}
            </span>
          </div>

          <!-- Timer -->
          <div id="timer-section" class="${state.timerRunning ? '' : 'hidden'} bg-gym-800 rounded-2xl p-5 border border-gym-700 text-center">
            <div class="relative w-32 h-32 mx-auto mb-3">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="54" fill="none" stroke="#333" stroke-width="8"/>
                <circle id="timer-circle" class="timer-circle" cx="60" cy="60" r="54" fill="none" stroke="#ef4444" stroke-width="8"
                  stroke-dasharray="${2 * Math.PI * 54}" stroke-dashoffset="0" stroke-linecap="round"/>
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <span id="timer-display" class="text-3xl font-bold">${formatTime(state.timerSeconds)}</span>
              </div>
            </div>
            <p class="text-sm text-gray-400 mb-3">Odpoczynek</p>
            <button onclick="skipTimer()" class="text-sm text-gym-accent font-semibold">Pomiń →</button>
          </div>

          <!-- Lista ćwiczeń w treningu -->
          ${w.exercises.map((we, idx) => renderWorkoutExercise(we, idx)).join('')}

          <!-- Dodaj ćwiczenie -->
          <button onclick="openAddExerciseToWorkout()" class="w-full border-2 border-dashed border-gym-600 rounded-xl py-4 text-gray-400 hover:border-gym-accent hover:text-gym-accent transition font-medium">
            + Dodaj ćwiczenie
          </button>

          <button onclick="finishWorkout()" class="w-full bg-gym-green text-black font-bold py-3.5 rounded-xl mt-2">
            Zakończ i zapisz trening
          </button>
        </div>
      `;
      return html;
    }

    function renderWorkoutExercise(we, idx) {
      const ex = state.exercises.find(e => e.id === we.exerciseId) || { name: 'Nieznane', image: '' };
      const isMyo = state.activeWorkout.mode === 'myoreps';

      return `
        <div class="bg-gym-800 rounded-xl border border-gym-700 overflow-hidden">
          <div class="flex items-center gap-3 p-3 border-b border-gym-700">
            <div class="w-12 h-12 rounded-lg bg-gym-700 overflow-hidden flex-shrink-0">
              ${ex.image ? `<img src="${ex.image}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='💪'">` : '💪'}
            </div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold truncate">${ex.name}</div>
              <div class="text-xs text-gray-400">${isMyo ? 'Myo-reps' : 'Serie standardowe'}</div>
            </div>
            <button onclick="removeExerciseFromWorkout(${idx})" class="text-gray-500 hover:text-gym-accent text-sm px-2">✕</button>
          </div>

          <div class="p-3 space-y-2">
            ${we.sets.map((s, sIdx) => `
              <div class="flex items-center gap-2 ${s.done ? 'opacity-60' : ''}">
                <span class="text-xs text-gray-500 w-6">${sIdx === 0 && isMyo ? 'A' : sIdx + 1}</span>
                <input type="number" value="${s.weight}" onchange="updateSet(${idx},${sIdx},'weight',this.value)" 
                  class="w-16 bg-gym-700 border border-gym-600 rounded-lg px-2 py-1.5 text-center text-sm outline-none" placeholder="kg" ${s.done ? 'disabled' : ''}>
                <span class="text-gray-500 text-sm">×</span>
                <input type="number" value="${s.reps}" onchange="updateSet(${idx},${sIdx},'reps',this.value)" 
                  class="w-16 bg-gym-700 border border-gym-600 rounded-lg px-2 py-1.5 text-center text-sm outline-none" placeholder="rep" ${s.done ? 'disabled' : ''}>
                ${s.done 
                  ? `<span class="text-gym-green text-sm ml-auto">✓</span>` 
                  : `<button onclick="completeSet(${idx},${sIdx})" class="ml-auto bg-gym-accent text-white text-xs font-bold px-3 py-1.5 rounded-lg">Gotowe</button>`
                }
              </div>
            `).join('')}

            <button onclick="addSet(${idx})" class="w-full text-sm text-gray-400 hover:text-white py-2 border border-dashed border-gym-600 rounded-lg mt-1">
              + Dodaj serię
            </button>
          </div>
        </div>
      `;
    }

    function openAddExerciseToWorkout() {
      const list = state.exercises.map(ex => `
        <button onclick="addExerciseToWorkout('${ex.id}')" class="w-full flex items-center gap-3 p-3 bg-gym-700 hover:bg-gym-600 rounded-xl text-left transition">
          <div class="w-12 h-12 rounded-lg bg-gym-600 overflow-hidden flex-shrink-0">
            ${ex.image ? `<img src="${ex.image}" class="w-full h-full object-cover">` : '💪'}
          </div>
          <div>
            <div class="font-medium">${ex.name}</div>
            <div class="text-xs text-gray-400">${ex.muscle}</div>
          </div>
        </button>
      `).join('');
      openModal(`
        <h2 class="text-lg font-bold mb-4">Dodaj ćwiczenie</h2>
        <div class="space-y-2 max-h-80 overflow-y-auto">${list || '<p class="text-gray-500">Brak ćwiczeń – dodaj je najpierw w zakładce Ćwiczenia</p>'}</div>
      `);
    }

    function addExerciseToWorkout(exId) {
      const isMyo = state.activeWorkout.mode === 'myoreps';
      state.activeWorkout.exercises.push({
        exerciseId: exId,
        sets: isMyo 
          ? [{ weight: 0, reps: state.settings.myoActivationReps, done: false }]
          : [{ weight: 0, reps: 8, done: false }, { weight: 0, reps: 8, done: false }, { weight: 0, reps: 8, done: false }]
      });
      closeModal();
      render();
    }

    function removeExerciseFromWorkout(idx) {
      state.activeWorkout.exercises.splice(idx, 1);
      render();
    }

    function addSet(exIdx) {
      const isMyo = state.activeWorkout.mode === 'myoreps';
      const sets = state.activeWorkout.exercises[exIdx].sets;
      const last = sets[sets.length - 1];
      sets.push({
        weight: last ? last.weight : 0,
        reps: isMyo ? state.settings.myoMiniReps : (last ? last.reps : 8),
        done: false
      });
      render();
    }

    function updateSet(exIdx, setIdx, field, value) {
      state.activeWorkout.exercises[exIdx].sets[setIdx][field] = parseFloat(value) || 0;
    }

    function completeSet(exIdx, setIdx) {
      const set = state.activeWorkout.exercises[exIdx].sets[setIdx];
      if (!set.weight && set.weight !== 0) return toast('Podaj ciężar', 'error');
      set.done = true;

      const isMyo = state.activeWorkout.mode === 'myoreps';
      const rest = isMyo ? state.settings.myoRestTime : state.settings.restTime;

      // Auto-add next mini-set for Myo-reps after activation
      if (isMyo && setIdx === 0) {
        // po aktywacji dodajemy pierwszą mini-serię
        state.activeWorkout.exercises[exIdx].sets.push({
          weight: set.weight,
          reps: state.settings.myoMiniReps,
          done: false
        });
      }

      startTimer(rest, () => {
        // po timerze nic specjalnego – użytkownik kontynuuje
      });
      render();
      toast('Seria zapisana! Odpoczynek...', 'success');
    }

    function finishWorkout() {
      if (!state.activeWorkout.exercises.length) {
        toast('Dodaj przynajmniej jedno ćwiczenie', 'error');
        return;
      }
      // usuń puste serie
      state.activeWorkout.exercises.forEach(we => {
        we.sets = we.sets.filter(s => s.done || s.weight || s.reps);
      });
      state.workouts.unshift(state.activeWorkout);
      saveWorkouts();
      state.activeWorkout = null;
      stopTimer();
      state.page = 'history';
      render();
      toast('Trening zapisany!', 'success');
    }

    // ---------- HISTORY ----------
    function renderHistory() {
      if (state.workouts.length === 0) {
        return `<div class="text-center py-16 text-gray-500">Brak zapisanych treningów.<br>Zacznij pierwszy!</div>`;
      }
      return `
        <div class="space-y-3 fade-in">
          ${state.workouts.map((w, idx) => `
            <div class="bg-gym-800 rounded-xl border border-gym-700 overflow-hidden">
              <button onclick="toggleHistoryDetail(${idx})" class="w-full p-4 text-left flex justify-between items-center">
                <div>
                  <div class="font-semibold">${formatDate(w.date)}</div>
                  <div class="text-sm text-gray-400 mt-0.5">
                    ${w.exercises.length} ćw. • ${w.exercises.reduce((a,e) => a + e.sets.filter(s=>s.done).length, 0)} serii
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs px-2 py-0.5 rounded-full ${w.mode === 'myoreps' ? 'bg-blue-500/20 text-blue-400' : 'bg-gym-accent/20 text-gym-accent'}">
                    ${w.mode === 'myoreps' ? 'Myo' : 'Std'}
                  </span>
                  <span class="text-gray-500">▾</span>
                </div>
              </button>
              <div id="hist-${idx}" class="hidden border-t border-gym-700 p-4 space-y-3">
                ${w.exercises.map(we => {
                  const ex = state.exercises.find(e => e.id === we.exerciseId) || { name: 'Usunięte ćwiczenie' };
                  return `
                    <div>
                      <div class="font-medium text-sm mb-1">${ex.name}</div>
                      <div class="flex flex-wrap gap-1.5">
                        ${we.sets.filter(s => s.done).map(s => `
                          <span class="text-xs bg-gym-700 px-2 py-1 rounded">${s.weight}kg × ${s.reps}</span>
                        `).join('') || '<span class="text-xs text-gray-500">Brak serii</span>'}
                      </div>
                    </div>
                  `;
                }).join('')}
                <button onclick="deleteWorkout(${idx})" class="text-xs text-gym-accent mt-2">Usuń trening</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleHistoryDetail(idx) {
      const el = document.getElementById('hist-' + idx);
      el.classList.toggle('hidden');
    }

    function deleteWorkout(idx) {
      if (!confirm('Usunąć ten trening z historii?')) return;
      state.workouts.splice(idx, 1);
      saveWorkouts();
      render();
      toast('Usunięto');
    }

    // ---------- SETTINGS ----------
    function renderSettings() {
      const s = state.settings;
      return `
        <div class="space-y-5 fade-in">
          <div class="bg-gym-800 rounded-xl p-4 border border-gym-700 space-y-4">
            <h3 class="font-semibold">Czasy odpoczynku</h3>
            <div>
              <label class="text-sm text-gray-400">Standard (sekundy)</label>
              <input type="number" value="${s.restTime}" onchange="updateSetting('restTime', this.value)" 
                class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none">
            </div>
            <div>
              <label class="text-sm text-gray-400">Myo-reps – przerwa między mini-seriami (sekundy)</label>
              <input type="number" value="${s.myoRestTime}" onchange="updateSetting('myoRestTime', this.value)" 
                class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none">
            </div>
          </div>

          <div class="bg-gym-800 rounded-xl p-4 border border-gym-700 space-y-4">
            <h3 class="font-semibold">Myo-reps – domyślne wartości</h3>
            <div>
              <label class="text-sm text-gray-400">Powtórzenia aktywacyjne</label>
              <input type="number" value="${s.myoActivationReps}" onchange="updateSetting('myoActivationReps', this.value)" 
                class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none">
            </div>
            <div>
              <label class="text-sm text-gray-400">Powtórzenia mini-serii</label>
              <input type="number" value="${s.myoMiniReps}" onchange="updateSetting('myoMiniReps', this.value)" 
                class="w-full bg-gym-700 border border-gym-600 rounded-lg px-3 py-2.5 mt-1 outline-none">
            </div>
          </div>

          <div class="bg-gym-800 rounded-xl p-4 border border-gym-700 space-y-3">
            <h3 class="font-semibold">Powiadomienia</h3>
            <label class="flex items-center justify-between">
              <span class="text-sm">Dźwięk po zakończeniu odpoczynku</span>
              <input type="checkbox" ${s.soundEnabled ? 'checked' : ''} onchange="updateSetting('soundEnabled', this.checked)" class="w-5 h-5 accent-gym-accent">
            </label>
            <label class="flex items-center justify-between">
              <span class="text-sm">Wibracje</span>
              <input type="checkbox" ${s.vibrateEnabled ? 'checked' : ''} onchange="updateSetting('vibrateEnabled', this.checked)" class="w-5 h-5 accent-gym-accent">
            </label>
          </div>

          <div class="bg-gym-800 rounded-xl p-4 border border-gym-700">
            <h3 class="font-semibold mb-2">Dane</h3>
            <button onclick="resetExercises()" class="text-sm text-gym-blue mb-2 block">Przywróć domyślną listę ćwiczeń</button>
            <button onclick="exportData()" class="text-sm text-gym-blue mb-2 block">Eksportuj dane (JSON)</button>
            <button onclick="if(confirm('Na pewno usunąć WSZYSTKIE dane?')){localStorage.clear();location.reload()}" class="text-sm text-gym-accent block">Wyczyść wszystkie dane</button>
          </div>

          <p class="text-center text-xs text-gray-600 pt-4">Siłowy Trening v1.0 • Dane tylko na tym urządzeniu</p>
        </div>
      `;
    }

    function updateSetting(key, value) {
      if (typeof value === 'string' && !isNaN(value) && key !== 'soundEnabled' && key !== 'vibrateEnabled') {
        value = parseInt(value) || 0;
      }
      state.settings[key] = value;
      saveSettings();
      toast('Zapisano', 'success');
    }

    function resetExercises() {
      if (!confirm('Nadpisać listę ćwiczeń domyślnymi? Twoje własne ćwiczenia znikną.')) return;
      state.exercises = [...DEFAULT_EXERCISES];
      saveExercises();
      render();
      toast('Przywrócono domyślne ćwiczenia', 'success');
    }

    function exportData() {
      const data = {
        exercises: state.exercises,
        workouts: state.workouts,
        settings: state.settings,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trening-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Pobrano backup', 'success');
    }

    // ==================== INIT ====================
    loadData();
    render();
  </script>
</body>
</html>
